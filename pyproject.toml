[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-team"
version = "4.1.0"
description = "Cross-platform multi-agent software engineering orchestrator for Gemini / Antigravity, Codex and Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AI Engineering Team Contributors" }
]
keywords = [
    "ai",
    "multi-agent",
    "orchestrator",
    "gemini",
    "antigravity",
    "codex",
    "claude-code",
    "software-engineering",
    "code-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/tomaasz/ai-engineering-team"
Repository = "https://github.com/tomaasz/ai-engineering-team"
Issues = "https://github.com/tomaasz/ai-engineering-team/issues"
Changelog = "https://github.com/tomaasz/ai-engineering-team/blob/main/CHANGELOG.md"

[project.scripts]
ai-team = "ai_team.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_team = [
    "templates/**/*",
    "templates/.agents/**/*",
    "templates/.claude/**/*",
    "templates/.vscode/*",
    "profiles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
