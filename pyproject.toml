[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-team"
version = "3.0.0"
description = "Cross-platform AI engineering team installer and orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-team = "ai_team.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_team = ["templates/**/*", "profiles/*.json"]
